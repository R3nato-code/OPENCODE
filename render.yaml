# Deploy no Render (Blueprint)
# https://dashboard.render.com → New + → Blueprint

services:
  - type: web
    name: quadro-escolar
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true

# ATENÇAO (plano free): o disco é efêmero — o banco SQLite (data/escola.db)
# é recriado a cada deploy/restart, voltando ao estado inicial semeado.
# Em planos pagos, para manter os dados adicione um disco:
#
#    disk:
#      name: dados
#      mountPath: /var/data
#      sizeGB: 1
# e a variável de ambiente:
#    - key: DATA_DIR
#      value: /var/data
